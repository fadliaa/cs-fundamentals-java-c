name: CI (Java & C11)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run Java test suite
        run: |
          mkdir -p java/out
          javac -d java/out $(find java/src -name "*.java")
          java -cp java/out com.fadlia.fundamentals.TestRunner

  c-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run C11 tests with strict warnings
        working-directory: c
        run: make test
